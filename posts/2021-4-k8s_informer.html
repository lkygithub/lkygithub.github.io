        <script>
            // The webfont uses font-display: optional, so the browser never
            // swaps fonts mid-view and the layout cannot jitter. The trade-off
            // is that a hard refresh (cold cache) renders with the fallback
            // and stays there. Recover here: load every slice the page needs
            // in the background, then switch families once, in one clean step.
            (function () {
                if (!(document.fonts && document.fonts.check && document.fonts.load)) return;
                var probe = '1em "LXGW WenKai Screen"';
                if (document.fonts.check(probe, '永a')) return;
                document.fonts.load(probe, document.body.textContent).then(function () {
                    document.documentElement.classList.add('wenkai');
                });
            })();
        </script>
        <script>
            // A copy button per code block. navigator.clipboard needs HTTPS or
            // localhost, so fall back to the old execCommand path elsewhere.
            (function () {
                var blocks = document.querySelectorAll('.blog-post-content pre');
                for (var i = 0; i < blocks.length; i++) {
                    (function (pre) {
                        // Read the code before adding the button, or the label
                        // would end up inside the copied text.
                        var code = pre.textContent;
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'copy-btn';
                        btn.textContent = '复制';
                        btn.addEventListener('click', function () {
                            var done = function () {
                                btn.textContent = '已复制';
                                setTimeout(function () { btn.textContent = '复制'; }, 1500);
                            };
                            var fallback = function () {
                                var ta = document.createElement('textarea');
                                ta.value = code;
                                ta.style.position = 'fixed';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.select();
                                try { document.execCommand('copy'); done(); }
                                catch (e) { btn.textContent = '复制失败'; }
                                document.body.removeChild(ta);
                            };
                            if (navigator.clipboard && window.isSecureContext) {
                                navigator.clipboard.writeText(code).then(done, fallback);
                            } else {
                                fallback();
                            }
                        });
                        var wrap = document.createElement('div');
                        wrap.className = 'copy-wrap';
                        pre.parentNode.insertBefore(wrap, pre);
                        wrap.appendChild(pre);
                        wrap.appendChild(btn);
                        // Language tag from the fence, shown in the corner.
                        var code = pre.querySelector('code');
                        var m = code && code.className.match(/language-([\w+#-]+)/);
                        if (m) {
                            var lab = document.createElement('span');
                            lab.className = 'code-lang';
                            lab.textContent = m[1];
                            wrap.appendChild(lab);
                        }
                    })(blocks[i]);
                }
            })();
        </script>
        <script>
            // Click a post image to view it full screen; click again or press
            // Esc to close. One shared overlay, no library.
            (function () {
                var imgs = document.querySelectorAll('.blog-post-content img');
                if (!imgs.length) return;
                var box = document.createElement('div');
                box.id = 'lightbox';
                var big = document.createElement('img');
                box.appendChild(big);
                document.body.appendChild(box);
                var close = function () { box.classList.remove('show'); big.src = ''; };
                box.addEventListener('click', close);
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') close();
                });
                for (var i = 0; i < imgs.length; i++) {
                    imgs[i].addEventListener('click', function () {
                        big.src = this.src;
                        box.classList.add('show');
                    });
                }
            })();
        </script>
