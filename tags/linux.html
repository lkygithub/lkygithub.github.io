        <script>
            // Pick the theme before the first paint so the page never flashes.
            (function () {
                var saved = null;
                try { saved = localStorage.getItem('theme'); } catch (e) {}
                var dark = saved
                    ? saved === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
            })();
        </script>

        <script>
            (function () {
                var html = document.documentElement;
                document.getElementById('theme-toggle').addEventListener('click', function () {
                    var dark = html.classList.toggle('dark');
                    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
                    // Keep the comment box in step with the page.
                    var frame = document.querySelector('iframe.giscus-frame');
                    if (frame) {
                        frame.contentWindow.postMessage(
                            { giscus: { setConfig: { theme: dark ? 'dark' : 'light' } } },
                            'https://giscus.app'
                        );
                    }
                });
            })();
        </script>
        <script>
            // A copy button per code block. navigator.clipboard needs HTTPS or
            // localhost, so fall back to the old execCommand path elsewhere.
            (function () {
                var blocks = document.querySelectorAll('.blog-post-content pre');
                for (var i = 0; i < blocks.length; i++) {
                    (function (pre) {
                        // Read the code before adding the button, or the label
                        // would end up inside the copied text.
                        var code = pre.textContent;
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'copy-btn';
                        btn.textContent = '复制';
                        btn.addEventListener('click', function () {
                            var done = function () {
                                btn.textContent = '已复制';
                                setTimeout(function () { btn.textContent = '复制'; }, 1500);
                            };
                            var fallback = function () {
                                var ta = document.createElement('textarea');
                                ta.value = code;
                                ta.style.position = 'fixed';
                                ta.style.opacity = '0';
                                document.body.appendChild(ta);
                                ta.select();
                                try { document.execCommand('copy'); done(); }
                                catch (e) { btn.textContent = '复制失败'; }
                                document.body.removeChild(ta);
                            };
                            if (navigator.clipboard && window.isSecureContext) {
                                navigator.clipboard.writeText(code).then(done, fallback);
                            } else {
                                fallback();
                            }
                        });
                        var wrap = document.createElement('div');
                        wrap.className = 'copy-wrap';
                        pre.parentNode.insertBefore(wrap, pre);
                        wrap.appendChild(pre);
                        wrap.appendChild(btn);
                        // Language tag from the fence, shown in the corner.
                        var code = pre.querySelector('code');
                        var m = code && code.className.match(/language-([\w+#-]+)/);
                        if (m) {
                            var lab = document.createElement('span');
                            lab.className = 'code-lang';
                            lab.textContent = m[1];
                            wrap.appendChild(lab);
                        }
                    })(blocks[i]);
                }
            })();
        </script>
        <script>
            // Click a post image to view it full screen; click again or press
            // Esc to close. One shared overlay, no library.
            (function () {
                var imgs = document.querySelectorAll('.blog-post-content img');
                if (!imgs.length) return;
                var box = document.createElement('div');
                box.id = 'lightbox';
                var big = document.createElement('img');
                box.appendChild(big);
                document.body.appendChild(box);
                var close = function () { box.classList.remove('show'); big.src = ''; };
                box.addEventListener('click', close);
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') close();
                });
                for (var i = 0; i < imgs.length; i++) {
                    imgs[i].addEventListener('click', function () {
                        big.src = this.src;
                        box.classList.add('show');
                    });
                }
            })();
        </script>
