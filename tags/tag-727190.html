        <script>
            // Pick the theme before the first paint so the page never flashes.
            (function () {
                var saved = null;
                try { saved = localStorage.getItem('theme'); } catch (e) {}
                var dark = saved
                    ? saved === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
            })();
        </script>
    </head>
    <body>
        <section id="page-title">
            <h1><a href="../index.html">日日是好日</a></h1>
            <nav id="site-nav">
                <a href="../index.html">首页</a>
                <a href="../archive.html">归档</a>
                <a href="../tags.html">标签</a>
                <button id="theme-toggle" type="button" title="切换深色/浅色"></button>
            </nav>
        </section>
<section class="blog-post">
    <h1>实习</h1>
    <div class="blog-post-subheader">1 篇 · <a href="../tags.html">全部标签</a></div>
    <ul class="entry-list">

    </ul>
</section>
        <script>
            (function () {
                var html = document.documentElement;
                document.getElementById('theme-toggle').addEventListener('click', function () {
                    var dark = html.classList.toggle('dark');
                    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
                    // Keep the comment box in step with the page.
                    var frame = document.querySelector('iframe.giscus-frame');
                    if (frame) {
                        frame.contentWindow.postMessage(
                            { giscus: { setConfig: { theme: dark ? 'dark' : 'light' } } },
                            'https://giscus.app'
                        );
                    }
                });
            })();
        </script>
    </body>
</html>
